<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Message — your conversations</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202437;background:#f6f7fb;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;display:grid;place-items:center;background:radial-gradient(ellipse at 15% 0%,#e9eaff 0,transparent 35%),#f6f7fb}
    button,input,textarea{font:inherit}button{cursor:pointer}.app{width:min(1120px,100%);height:min(760px,calc(100vh - 56px));min-height:540px;display:grid;grid-template-columns:320px 1fr;background:#fff;border:1px solid #e8eaf1;border-radius:22px;overflow:hidden;box-shadow:0 24px 80px #242b5012}
    aside{border-right:1px solid #eceef4;display:flex;flex-direction:column;min-height:0}.sidebar-head{padding:25px 22px 18px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:750;letter-spacing:-.4px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:#6558e8;color:#fff;font-size:18px}.sidebar-head p{margin:7px 0 0;color:#8b90a3;font-size:13px}.section-title{padding:8px 22px 10px;color:#969bad;font-weight:700;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}.icon-button{border:0;background:#f0efff;color:#6257d9;border-radius:9px;width:28px;height:28px;font-size:19px;line-height:1}.contact-list{padding:0 10px;overflow:auto;flex:1}.contact{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:12px;text-align:left;background:transparent;color:inherit}.contact:hover{background:#f8f8fc}.contact.active{background:#f0efff}.avatar{flex:0 0 42px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:#f3e4d6}.contact-copy{min-width:0;flex:1}.contact-name{font-size:13px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.contact-preview{display:block;color:#9296a7;font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty-list{color:#999daf;text-align:center;padding:35px 20px;font-size:13px;line-height:1.6}.sidebar-footer{padding:15px 20px;border-top:1px solid #eceef4;display:flex;align-items:center;gap:11px}.sidebar-footer .avatar{width:36px;height:36px;flex-basis:36px;font-size:18px}.me-copy{min-width:0;flex:1}.me-copy strong{display:block;font-size:12px}.me-copy span{display:block;color:#9296a7;font-size:11px;margin-top:3px}.edit-button{border:0;background:none;color:#777b8d;font-size:12px;padding:8px}
    main{display:flex;flex-direction:column;min-width:0;min-height:0}.chat-head{height:82px;padding:0 26px;border-bottom:1px solid #eceef4;display:flex;align-items:center;gap:13px}.chat-head .avatar{width:44px;height:44px;flex-basis:44px}.chat-person{flex:1;min-width:0}.chat-person strong{display:block;font-size:14px}.chat-person span{display:block;color:#9095a7;font-size:11px;margin-top:4px}.profile-button{border:1px solid #e8e9f0;background:white;color:#696d7e;border-radius:9px;padding:8px 11px;font-size:11px}.messages{flex:1;overflow:auto;padding:26px 28px;background:linear-gradient(#fff,#fdfdff)}.day-label{text-align:center;color:#a0a4b1;font-size:10px;margin:0 0 20px}.message-row{display:flex;margin:12px 0}.message-row.mine{justify-content:flex-end}.bubble-wrap{max-width:min(72%,480px)}.bubble{padding:11px 14px;border-radius:15px 15px 15px 4px;background:#f0f1f6;color:#35394b;font-size:13px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}.mine .bubble{background:#6558e8;color:white;border-radius:15px 15px 4px 15px}.message-time{display:block;color:#a3a6b3;font-size:9px;margin:5px 3px 0}.mine .message-time{text-align:right}.empty-chat{height:100%;display:grid;place-items:center;text-align:center;color:#9095a7;font-size:13px;line-height:1.7}.empty-chat b{display:block;color:#474b5e;font-size:16px;margin-bottom:4px}.composer{padding:16px 22px 20px;border-top:1px solid #eceef4}.compose-box{display:flex;align-items:flex-end;gap:10px;padding:8px 9px 8px 14px;border:1px solid #e8e9f0;border-radius:14px;background:#fff;box-shadow:0 3px 10px #242b5008}.compose-box:focus-within{border-color:#b9b3f5;box-shadow:0 0 0 3px #6558e812}.compose-box textarea{resize:none;max-height:120px;min-height:28px;flex:1;border:0;outline:0;padding:5px 0;color:#303447;font-size:13px;line-height:1.5}.compose-box textarea::placeholder{color:#afb2bf}.send-button{width:36px;height:36px;border:0;border-radius:10px;background:#6558e8;color:#fff;font-size:17px}.send-button:hover{background:#5447d5}.hint{text-align:right;color:#a6a9b5;font-size:9px;padding:7px 4px 0}.modal-backdrop{position:fixed;inset:0;background:#17192b66;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(390px,100%);background:#fff;border-radius:18px;padding:23px;box-shadow:0 20px 70px #17192b30}.modal h2{margin:0 0 7px;font-size:18px}.modal p{margin:0 0 19px;color:#898da0;font-size:12px;line-height:1.5}.field{display:block;margin:13px 0}.field span{display:block;font-size:11px;font-weight:700;color:#666a7c;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #e6e7ef;border-radius:9px;padding:10px 11px;outline:0;font-size:13px}.field input:focus,.field textarea:focus{border-color:#aaa3f0}.field textarea{resize:vertical;min-height:70px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.secondary,.primary{border:0;border-radius:9px;padding:10px 14px;font-size:12px;font-weight:650}.secondary{background:#f1f2f6;color:#696d7e}.primary{background:#6558e8;color:#fff}.profile-card{display:flex;align-items:center;gap:15px;padding:14px;background:#f8f8fc;border-radius:12px;margin:14px 0}.profile-card .avatar{width:52px;height:52px;flex-basis:52px}.profile-card strong{display:block;font-size:14px}.profile-card span{display:block;color:#9095a7;font-size:11px;margin-top:4px}.profile-note{font-size:12px;color:#6f7384;line-height:1.6;white-space:pre-wrap}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#292c3c;color:white;border-radius:10px;padding:10px 15px;font-size:12px;z-index:10;box-shadow:0 8px 25px #0002}
    @media(max-width:700px){body{padding:0}.app{height:100dvh;min-height:0;border:0;border-radius:0;grid-template-columns:94px 1fr}.sidebar-head{padding:17px 10px 14px;text-align:center}.brand{justify-content:center}.brand-name,.sidebar-head p,.section-title span,.contact-copy,.sidebar-footer .me-copy,.edit-button{display:none}.section-title{justify-content:center;padding:4px 0 10px}.contact-list{padding:0 7px}.contact{justify-content:center;padding:9px 3px}.contact .avatar{width:45px;height:45px;flex-basis:45px}.empty-list{padding:18px 4px;font-size:10px}.sidebar-footer{justify-content:center;padding:12px 4px}.sidebar-footer .avatar{width:40px;height:40px;flex-basis:40px}.chat-head{height:72px;padding:0 14px;gap:10px}.chat-head .avatar{width:40px;height:40px;flex-basis:40px}.profile-button{padding:8px;font-size:10px}.messages{padding:20px 14px}.bubble-wrap{max-width:85%}.composer{padding:12px}.hint{font-size:8px}}
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="sidebar-head"><div class="brand"><span class="brand-mark">✉</span><span class="brand-name">Message</span></div><p>Your conversations, kept yours.</p></div>
      <div class="section-title"><span>People</span><button class="icon-button" id="addContact" aria-label="Add person" title="Add person">+</button></div>
      <div class="contact-list" id="contactList"></div>
      <div class="sidebar-footer"><div class="avatar" id="myAvatar">🙂</div><div class="me-copy"><strong id="myName">You</strong><span>Your profile</span></div><button class="edit-button" id="editProfile">Edit</button></div>
    </aside>
    <main>
      <header class="chat-head" id="chatHead"></header>
      <section class="messages" id="messages" aria-live="polite"></section>
      <form class="composer" id="messageForm"><div class="compose-box"><textarea id="messageInput" rows="1" placeholder="Write a message…" aria-label="Message"></textarea><button class="send-button" aria-label="Send message" title="Send">➤</button></div><div class="hint">Enter to send · Shift + Enter for a new line</div></form>
    </main>
  </div>
  <div id="overlay"></div><div id="toast" role="status" hidden></div>
  <script>
    (() => {
      const STORAGE_KEY = 'message-app-data-v1';
      const starter = {
        me: {name: 'You', emoji: '🙂', about: 'A little about me'},
        contacts: [
          {id: 'sam', name: 'Sam Rivera', emoji: '🌿', about: 'Usually out exploring.', messages: [{text: 'Hey! How have you been?', mine: false, time: Date.now() - 3600000}, {text: 'Doing well, thanks! What have you been up to?', mine: true, time: Date.now() - 3500000}]},
          {id: 'alex', name: 'Alex Chen', emoji: '☀️', about: 'Coffee enthusiast ☕', messages: [{text: 'Want to catch up this weekend?', mine: false, time: Date.now() - 86400000}]}
        ]
      };
      let state;
      try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || starter; } catch { state = starter; }
      if (!state.me || !Array.isArray(state.contacts)) state = starter;
      let activeId = state.contacts[0]?.id || null;
      const $ = id => document.getElementById(id);
      const escapeText = value => String(value ?? '');
      function persist(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      function activeContact(){ return state.contacts.find(person => person.id === activeId); }
      function timeLabel(time){ return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(time)); }
      function lastMessage(person){ return person.messages[person.messages.length - 1]?.text || 'No messages yet'; }
      function render(){
        $('myAvatar').textContent = state.me.emoji || '🙂'; $('myName').textContent = state.me.name || 'You';
        const list = $('contactList'); list.replaceChildren();
        if (!state.contacts.length){ const empty=document.createElement('div'); empty.className='empty-list'; empty.textContent='No people yet. Tap + to add someone.'; list.append(empty); }
        state.contacts.forEach(person => {
          const button=document.createElement('button'); button.className='contact'+(person.id===activeId?' active':''); button.type='button';
          const avatar=document.createElement('span'); avatar.className='avatar'; avatar.textContent=person.emoji||'👤';
          const copy=document.createElement('span'); copy.className='contact-copy'; const name=document.createElement('span'); name.className='contact-name'; name.textContent=person.name;
          const preview=document.createElement('span'); preview.className='contact-preview'; preview.textContent=lastMessage(person); copy.append(name,preview); button.append(avatar,copy);
          button.addEventListener('click',()=>{activeId=person.id;render();}); list.append(button);
        });
        const person=activeContact(); $('chatHead').replaceChildren(); $('messages').replaceChildren();
        if (!person){ const title=document.createElement('div'); title.className='chat-person'; title.innerHTML='<strong>Your messages</strong><span>Add a person to start a conversation.</span>'; $('chatHead').append(title); $('messages').innerHTML='<div class="empty-chat"><div><b>Welcome to Message</b>Your conversations and profiles are saved on this device.</div></div>'; $('messageInput').disabled=true; return; }
        $('messageInput').disabled=false;
        const avatar=document.createElement('div'); avatar.className='avatar'; avatar.textContent=person.emoji||'👤'; const copy=document.createElement('div'); copy.className='chat-person'; const title=document.createElement('strong'); title.textContent=person.name; const status=document.createElement('span'); status.textContent='Conversation saved on this device'; copy.append(title,status); const profile=document.createElement('button'); profile.className='profile-button'; profile.type='button'; profile.textContent='Profile'; profile.addEventListener('click',()=>showProfile(person)); $('chatHead').append(avatar,copy,profile);
        if(!person.messages.length){const empty=document.createElement('div');empty.className='empty-chat';const inner=document.createElement('div');const bold=document.createElement('b');bold.textContent='Say hello to '+person.name;inner.append(bold,document.createTextNode('Your messages will be saved here.'));empty.append(inner);$('messages').append(empty);return;}
        const day=document.createElement('div');day.className='day-label';day.textContent='MESSAGES';$('messages').append(day);
        person.messages.forEach(message=>{const row=document.createElement('div');row.className='message-row'+(message.mine?' mine':'');const wrap=document.createElement('div');wrap.className='bubble-wrap';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=message.text;const time=document.createElement('span');time.className='message-time';time.textContent=timeLabel(message.time);wrap.append(bubble,time);row.append(wrap);$('messages').append(row);}); $('messages').scrollTop=$('messages').scrollHeight;
      }
      function modal(title,description,fields,onSave){
        const backdrop=document.createElement('div');backdrop.className='modal-backdrop';backdrop.addEventListener('click',e=>{if(e.target===backdrop)backdrop.remove();});
        const box=document.createElement('form');box.className='modal';const heading=document.createElement('h2');heading.textContent=title;const desc=document.createElement('p');desc.textContent=description;box.append(heading,desc);
        fields.forEach(field=>{const label=document.createElement('label');label.className='field';const caption=document.createElement('span');caption.textContent=field.label;const input=field.multiline?document.createElement('textarea'):document.createElement('input');input.name=field.name;input.value=field.value||'';input.placeholder=field.placeholder||'';if(field.maxLength)input.maxLength=field.maxLength;label.append(caption,input);box.append(label);});
        const actions=document.createElement('div');actions.className='modal-actions';const cancel=document.createElement('button');cancel.type='button';cancel.className='secondary';cancel.textContent='Cancel';cancel.addEventListener('click',()=>backdrop.remove());const save=document.createElement('button');save.type='submit';save.className='primary';save.textContent='Save';actions.append(cancel,save);box.append(actions);box.addEventListener('submit',e=>{e.preventDefault();const values=Object.fromEntries(new FormData(box));if(onSave(values)!==false)backdrop.remove();});backdrop.append(box);$('overlay').replaceChildren(backdrop);box.querySelector('input,textarea')?.focus();
      }
      function showProfile(person){const backdrop=document.createElement('div');backdrop.className='modal-backdrop';backdrop.addEventListener('click',e=>{if(e.target===backdrop)backdrop.remove();});const box=document.createElement('div');box.className='modal';const title=document.createElement('h2');title.textContent='Profile';const card=document.createElement('div');card.className='profile-card';const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=person.emoji||'👤';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=person.name;const label=document.createElement('span');label.textContent='Saved contact';info.append(name,label);card.append(avatar,info);const note=document.createElement('div');note.className='profile-note';note.textContent=person.about||'No profile note yet.';const actions=document.createElement('div');actions.className='modal-actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='Edit profile';edit.addEventListener('click',()=>{backdrop.remove();editContact(person);});const close=document.createElement('button');close.className='primary';close.textContent='Done';close.addEventListener('click',()=>backdrop.remove());actions.append(edit,close);box.append(title,card,note,actions);backdrop.append(box);$('overlay').replaceChildren(backdrop);}
      function editContact(person){modal('Edit profile','Update the saved details for this person.',[{name:'name',label:'Name',value:person.name,placeholder:'Name',maxLength:60},{name:'emoji',label:'Avatar emoji',value:person.emoji,placeholder:'🙂',maxLength:8},{name:'about',label:'About',value:person.about,placeholder:'A short profile note',multiline:true}],values=>{if(!values.name.trim()){notify('Please enter a name.');return false;}Object.assign(person,{name:values.name.trim(),emoji:values.emoji.trim()||'👤',about:values.about.trim()});persist();render();});}
      function notify(text){const toast=$('toast');toast.textContent=text;toast.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.hidden=true,2300);}
      $('addContact').addEventListener('click',()=>modal('Add a person','Create a profile and start a saved conversation.',[{name:'name',label:'Name',placeholder:'e.g. Taylor'}, {name:'emoji',label:'Avatar emoji',placeholder:'🙂',maxLength:8},{name:'about',label:'About',placeholder:'A short profile note',multiline:true}],values=>{if(!values.name.trim()){notify('Please enter a name.');return false;}const person={id:crypto.randomUUID?.()||String(Date.now()),name:values.name.trim(),emoji:values.emoji.trim()||'👤',about:values.about.trim(),messages:[]};state.contacts.unshift(person);activeId=person.id;persist();render();}));
      $('editProfile').addEventListener('click',()=>modal('Your profile','This profile is saved with your conversations on this device.',[{name:'name',label:'Your name',value:state.me.name,placeholder:'Your name',maxLength:60},{name:'emoji',label:'Avatar emoji',value:state.me.emoji,placeholder:'🙂',maxLength:8},{name:'about',label:'About you',value:state.me.about,placeholder:'A short profile note',multiline:true}],values=>{if(!values.name.trim()){notify('Please enter a name.');return false;}state.me={name:values.name.trim(),emoji:values.emoji.trim()||'🙂',about:values.about.trim()};persist();render();}));
      $('messageForm').addEventListener('submit',event=>{event.preventDefault();const text=$('messageInput').value.trim();const person=activeContact();if(!text||!person)return;person.messages.push({text,mine:true,time:Date.now()});$('messageInput').value='';$('messageInput').style.height='auto';persist();render();$('messageInput').focus();});
      $('messageInput').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();$('messageForm').requestSubmit();}});
      $('messageInput').addEventListener('input',event=>{event.target.style.height='auto';event.target.style.height=Math.min(event.target.scrollHeight,120)+'px';});
      render();
    })();
  </script>
</body>
</html>
